version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense123
      POSTGRES_DB: stocksense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stocksense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksense-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://stocksense:stocksense123@postgres:5432/stocksense_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: stocksense-docker-production-secret-key-32chars!
      DEV_MODE: "true"
      ENVIRONMENT: production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stocksense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
